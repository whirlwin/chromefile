# Tab layout and hotkeys live in the Chromefile next to this file (apply it with
# `chromefile apply`), so they are not repeated here. Raw Chrome preferences
# (`settings:`) and other extensions' shortcuts (`shortcuts:`) can still go here.

# Claude Code sessions spawned from the browser (e.g. the Outlook button).
claude:
  cwd: ~/git

# Mods: user scripts registered through the bridge, kept in mods/.
mods:
  outlook-claude:
    matches: ["https://outlook.cloud.microsoft/*"]
    file: mods/outlook-claude.js
    # runAt: document_idle   (optional; world defaults to USER_SCRIPT)

# Personal mods and Claude personas go in ~/.config/chromefile/chrome.yaml, with
# their code in ~/.config/chromefile/mods/; scripts/chrome-apply.sh applies that
# file automatically after this one.
