[package]
name = "chromefile"
version = "0.1.0"
edition = "2024"
description = "Installs the Chromefile extension, native messaging host and MCP server on macOS, applies Chromefiles to Chrome, and runs the host"
license = "MIT"
repository = "https://github.com/whirlwin/chromefile"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
serde_json = "1.0.154"
sha2 = "0.11.1"
yaml-rust2 = { version = "0.13.0", default-features = false }
